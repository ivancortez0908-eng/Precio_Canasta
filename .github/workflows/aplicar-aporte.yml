name: Aplicar aporte aprobado
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
jobs:
  aplicar:
    if: github.event.label.name == 'aprobado'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Aplicar equivalencias (solo las comparaciones cuya tabla sigue en la issue)
        id: aplicar
        run: node scraper/aplicar-aporte.mjs
        env:
          CUERPO: ${{ github.event.issue.body }}
      - name: Guardar y cerrar la issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          RESUMEN: ${{ steps.aplicar.outputs.resumen }}
        run: |
          git config user.name "canasta-bot"
          git config user.email "canasta-bot@users.noreply.github.com"
          git add scraper/equivalencias.json
          git diff --cached --quiet || (git commit -m "Aplicar aporte #$NUM" && git push)
          # Comentario aparte: si la issue ya se cerró a mano, "gh issue close --comment" no lo publica
          gh issue comment "$NUM" --body "$RESUMEN"
          gh issue close "$NUM"
