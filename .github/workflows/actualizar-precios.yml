name: Actualizar precios
on:
  schedule: [{ cron: "0 12 * * *" }]   # todos los días, 6:00 a. m. hora de El Salvador
  workflow_dispatch: {}                 # botón "Run workflow" para correrlo a mano
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scraper/scrape.mjs
      - name: Guardar cambios
        run: |
          git config user.name "canasta-bot"
          git config user.email "canasta-bot@users.noreply.github.com"
          git add data/precios.json
          git diff --cached --quiet || (git commit -m "Actualizar precios $(date -u +%F)" && git push)
